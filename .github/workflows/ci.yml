name: ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'refactor/**', 'tests/**']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-release
          - os: windows-2025
            preset: windows-release
            offline_artifact: '9904151698'
          - os: macos-15
            preset: macos-arm64-release
            offline_artifact: '9905337785'
          - os: macos-15-intel
            preset: macos-x86_64-release
            offline_artifact: '9905337785'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb mesa-vulkan-drivers glslang-tools gdb libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev
      - name: Install offline shader compiler
        if: runner.os != 'Linux'
        shell: bash
        env:
          OFFLINE_ARTIFACT_ID: ${{ matrix.offline_artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/offline-compiler.zip"
          destination="$RUNNER_TEMP/offline-compiler"
          mkdir -p "$destination"
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/libsdl-org/SDL_shadercross/actions/artifacts/$OFFLINE_ARTIFACT_ID/zip" \
            --output "$archive"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$archive" "$destination" \
            || python -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$archive" "$destination"
          package=$(find "$destination" -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) -print -quit)
          if [[ "$package" == *.zip ]]; then
            python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$package" "$destination" \
              || python -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$package" "$destination"
          elif [[ -n "$package" ]]; then
            tar -xf "$package" -C "$destination"
          fi
          compiler=$(find "$destination" -type f \( -name shadercross -o -name shadercross.exe \) -print -quit)
          test -n "$compiler"
          chmod +x "$compiler" || true
          dirname "$compiler" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: GUI smoke test
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 8s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            ./build/${{ matrix.preset }}/pmxer
          status=$?
          if [ "$status" -ne 124 ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              gdb -batch -ex run -ex bt --args ./build/${{ matrix.preset }}/pmxer || true
            exit "$status"
          fi
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  linux-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy clang-format
      - name: GCC debug
        run: |
          cmake --preset linux-cli -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset linux-cli
          ctest --preset linux-cli
      - name: Clang debug
        run: |
          cmake --preset linux-clang
          cmake --build --preset linux-clang
          ctest --preset linux-clang

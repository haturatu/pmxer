name: ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'refactor/**', 'tests/**']
  pull_request:

jobs:
  shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmxer-shader-toolchain
          key: shader-toolchain-f686492-83fa691-1ff05be-dxc-1.9.2607
      - name: Compile platform shaders from pinned sources
        run: scripts/compile-shaders.sh assets/shaders/model.hlsl "$RUNNER_TEMP/compiled-shaders"
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-shaders
          path: ${{ runner.temp }}/compiled-shaders

  build:
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-release
          - os: windows-2025
            preset: windows-release
          - os: macos-15
            preset: macos-arm64-release
          - os: macos-15-intel
            preset: macos-x86_64-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb mesa-vulkan-drivers glslang-tools gdb libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev
      - uses: actions/download-artifact@v4
        with:
          name: compiled-shaders
          path: ${{ runner.temp }}/compiled-shaders
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPMXER_PRECOMPILED_SHADER_DIR="${{ runner.temp }}/compiled-shaders"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: GUI smoke test
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 8s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            ./build/${{ matrix.preset }}/pmxer
          status=$?
          if [ "$status" -ne 124 ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              gdb -batch -ex run -ex bt --args ./build/${{ matrix.preset }}/pmxer || true
            exit "$status"
          fi
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  linux-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy clang-format
      - name: GCC debug
        run: |
          cmake --preset linux-cli -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset linux-cli
          ctest --preset linux-cli
      - name: Clang debug
        run: |
          cmake --preset linux-clang
          cmake --build --preset linux-clang
          ctest --preset linux-clang

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      quality: ${{ steps.filter.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            build:
              - 'src/**'
              - 'tests/**'
              - 'assets/**'
              - 'scripts/**'
              - 'cmake/**'
              - 'external/**'
              - 'packaging/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'Makefile'
              - '.gitmodules'
              - '.github/workflows/ci.yml'
            quality:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'cmake/**'
              - 'external/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/ci.yml'
  shaders:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmxer-shader-toolchain
          key: shader-toolchain-f686492-83fa691-1ff05be-dxc-1.9.2607
      - name: Compile platform shaders from pinned sources
        run: scripts/compile-shaders.sh assets/shaders/model.hlsl "$RUNNER_TEMP/compiled-shaders"
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-shaders
          path: ${{ runner.temp }}/compiled-shaders

  build:
    needs: [changes, shaders]
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-release
          - os: windows-2025
            preset: windows-release
          - os: macos-15
            preset: macos-arm64-release
          - os: macos-15-intel
            preset: macos-x86_64-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb fonts-noto-cjk mesa-vulkan-drivers glslang-tools gdb libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev
      - uses: actions/download-artifact@v4
        with:
          name: compiled-shaders
          path: ${{ runner.temp }}/compiled-shaders
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPMXER_PRECOMPILED_SHADER_DIR="${{ runner.temp }}/compiled-shaders"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: GUI smoke test
        if: runner.os == 'Linux'
        run: |
          set +e
          for language in ja en zh-CN ru; do
            timeout --signal=TERM --kill-after=5s 8s \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              ./build/${{ matrix.preset }}/pmxer --lang "$language"
            status=$?
            if [ "$status" -ne 124 ]; then
              xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                gdb -batch -ex run -ex bt --args ./build/${{ matrix.preset }}/pmxer --lang "$language" || true
              exit "$status"
            fi
          done
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  linux-quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy clang-format
      - name: GCC debug
        run: |
          cmake --preset linux-cli -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset linux-cli
          ctest --preset linux-cli
      - name: Clang debug
        run: |
          cmake --preset linux-clang
          cmake --build --preset linux-clang
          ctest --preset linux-clang
